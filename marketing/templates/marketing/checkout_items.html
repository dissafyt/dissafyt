<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout • Dissafyt</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="mx-auto max-w-2xl px-4 py-10">
      <section class="rounded-lg bg-white p-8 shadow-sm">
        <h1 class="text-2xl font-semibold">Checkout</h1>

        <form id="checkout-form" method="post" action="/checkout/items/submit/">
          <div class="mt-4">
            <label class="block text-sm font-medium">Email</label>
            <input type="email" name="email" id="email" required class="mt-1 block w-full rounded border px-3 py-2" />
          </div>

          <div class="mt-4">
            <label class="block text-sm font-medium">Phone</label>
            <input type="text" name="phone" id="phone" class="mt-1 block w-full rounded border px-3 py-2" />
          </div>

          <div class="mt-4">
            <label class="block text-sm font-medium">Delivery mode</label>
            <div class="mt-2">
              <label><input type="radio" name="mode" value="pickup" checked /> Pickup</label>
              <label class="ml-4"><input type="radio" name="mode" value="delivery" /> Delivery</label>
            </div>
          </div>

          <div id="delivery-section" class="hidden mt-4">
            <p class="text-sm text-slate-600">Get shipping options for your address</p>
            <div class="mt-2">
              <input type="text" id="postcode" placeholder="Postal code" class="mt-1 block w-1/2 rounded border px-3 py-2" />
              <button type="button" id="get-rates" class="ml-2 rounded bg-slate-900 text-white px-3 py-2">Get rates</button>
            </div>

            <div id="rates-list" class="mt-4"></div>
          </div>

          <div class="mt-6">
            <h2 class="text-lg font-medium">Cart</h2>
            <div id="cart-summary" class="mt-2 text-sm text-slate-700">
              <!-- For demo, a single sample item -->
              <div>Sample Item • R100.00 x 1</div>
            </div>
          </div>

          <input type="hidden" name="cart_json" id="cart_json" />
          <input type="hidden" name="shipping_option" id="shipping_option" />

          <div class="mt-6">
            <button type="submit" class="rounded bg-slate-900 text-white px-4 py-2">Proceed to payment</button>
          </div>
        </form>
      </section>
    </main>

    <script>
      // Minimal client-side logic for demonstration
      const deliveryRadio = document.querySelectorAll('input[name="mode"]');
      const deliverySection = document.getElementById('delivery-section');
      const getRatesBtn = document.getElementById('get-rates');
      const ratesList = document.getElementById('rates-list');
      const cartJson = document.getElementById('cart_json');
      const shippingOption = document.getElementById('shipping_option');

      // Set demo cart
      const demoCart = [{product_code: 'sample_item', title: 'Sample Item', unit_price: 100.0, quantity: 1}];
      cartJson.value = JSON.stringify(demoCart);

      deliveryRadio.forEach(r => r.addEventListener('change', (e) => {
        if (e.target.value === 'delivery') {
          deliverySection.classList.remove('hidden');
        } else {
          deliverySection.classList.add('hidden');
          ratesList.innerHTML = '';
          shippingOption.value = '';
        }
      }));

      getRatesBtn.addEventListener('click', async () => {
        const postcode = document.getElementById('postcode').value.trim();
        if (!postcode) return alert('Please enter a postal code');

        ratesList.innerHTML = 'Loading...';
        const payload = {
          origin: { postal_code: '0000', country: 'ZA' },
          destination: { postal_code: postcode, country: 'ZA' },
          parcels: [{ weight: 1.0, length: 10, width: 10, height: 5 }],
          value: 100.0
        };

        try {
          const res = await fetch('/api/shipments/rates/', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
          const data = await res.json();
          if (!data.ok) {
            ratesList.innerHTML = '<div class="text-red-600">Failed to get rates</div>';
            return;
          }

          ratesList.innerHTML = '';
          data.options.forEach(opt => {
            const div = document.createElement('div');
            div.className = 'p-2 border rounded mb-2';
            div.innerHTML = `<label><input type="radio" name="rate_option" value='${JSON.stringify(opt)}' /> ${opt.label} — R${opt.amount}</label>`;
            ratesList.appendChild(div);
          });

          document.getElementsByName('rate_option').forEach(r => r.addEventListener('change', (e) => {
            shippingOption.value = e.target.value; // store JSON
          }));
        } catch (err) {
          ratesList.innerHTML = '<div class="text-red-600">Error fetching rates</div>';
        }
      });
    </script>
  </body>
</html>
