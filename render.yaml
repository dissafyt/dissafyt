services:
  - type: web
    name: dissafyt
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    releaseCommand: bash scripts/render_release.sh
    startCommand: gunicorn dissafyt_platform.wsgi --log-file -
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: dissafyt_platform.settings
